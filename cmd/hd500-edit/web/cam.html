<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedal Camera</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 13px/1.4 system-ui, sans-serif; }
  video { width: 100vw; height: 100vh; object-fit: contain; display: block; }
  #bar { position: fixed; left: 8px; top: 8px; display: flex; gap: 8px; align-items: center; opacity: .25; transition: opacity .2s; }
  #bar:hover { opacity: 1; }
  select, button { background: #222; color: #ddd; border: 1px solid #444; padding: 4px 6px; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; }
  #msg[hidden] { display: none; }
</style>
</head>
<body>
<!-- Development page: shows the webcam pointed at the pedal's LCD, so the
     LCD can be checked in the same browser as the editor (no window juggling).
     ?cam=<part of the camera name> picks a camera; ?rot=<degrees> rotates. -->
<video id="v" autoplay playsinline muted></video>
<div id="bar"><select id="dev" aria-label="Camera"></select><button id="rot" type="button" title="Rotate">⟳</button></div>
<div id="msg">Starting the camera…</div>
<script>
"use strict";
const q = new URLSearchParams(location.search);
const v = document.getElementById("v"), sel = document.getElementById("dev"), msg = document.getElementById("msg");
let rot = Number(q.get("rot") || localStorage.getItem("camRot") || 0);
const applyRot = () => { v.style.transform = rot ? `rotate(${rot}deg)` : ""; };

async function start(deviceId) {
  if (v.srcObject) v.srcObject.getTracks().forEach((t) => t.stop());
  const video = deviceId ? { deviceId: { exact: deviceId } } : true;
  v.srcObject = await navigator.mediaDevices.getUserMedia({ video: { ...((typeof video === "object") ? video : {}), width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
  msg.hidden = true;
}

async function init() {
  try {
    await start(); // ask permission first, so device names are visible
    const cams = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput");
    const want = (q.get("cam") || localStorage.getItem("cam") || "").toLowerCase();
    sel.innerHTML = cams.map((c, i) => `<option value="${c.deviceId}">${c.label || "Camera " + (i + 1)}</option>`).join("");
    const pick = cams.find((c) => want && c.label.toLowerCase().includes(want)) || cams.find((c) => !/facetime|built-in|continuity|iphone/i.test(c.label)) || cams[0];
    if (pick) { sel.value = pick.deviceId; await start(pick.deviceId); }
  } catch (e) {
    msg.textContent = `Camera not available: ${e.message}. Allow camera access for this browser in System Settings › Privacy & Security › Camera.`;
  }
}
sel.addEventListener("change", () => {
  try { localStorage.setItem("cam", sel.selectedOptions[0].textContent); } catch {}
  start(sel.value).catch((e) => { msg.hidden = false; msg.textContent = e.message; });
});
document.getElementById("rot").addEventListener("click", () => {
  rot = (rot + 90) % 360; applyRot();
  try { localStorage.setItem("camRot", String(rot)); } catch {}
});
applyRot();
init();
</script>
</body>
</html>
